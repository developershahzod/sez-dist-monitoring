<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Скачивание файла</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #eceef6;
        color: #0b0b0f;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0d;
          color: #f2f2f5;
        }
      }
    </style>
  </head>
  <body>
    <p id="msg">Файл скачивается… Вкладку можно закрыть.</p>
    <script>
      // Opened from an embedded copy of the platform (ArcGIS Experience Builder): the host frame may
      // forbid downloads, so this tab starts the download itself. Only our own API paths are accepted.
      var target = new URLSearchParams(location.search).get("u") || "";
      if (/^\/api\/[^/]/.test(target)) {
        location.replace(target);
        setTimeout(function () {
          window.close();
        }, 4000);
      } else {
        document.getElementById("msg").textContent = "Неверная ссылка на файл.";
      }
    </script>
  </body>
</html>
